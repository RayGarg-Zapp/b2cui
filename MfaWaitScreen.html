<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Begin MFA Setup</title>
  <style>
    body {
      background-color: #f0f6ff;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
      max-width: 600px;
      text-align: center;
    }
    h1 {
      color: #0078D4;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem;
      color: #333;
    }
    button {
      margin-top: 20px;
      background-color: #0078D4;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005a9e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Get Ready to Set Up MFA</h1>
    <p>You're about to begin the multi-factor authentication setup process.<br>
    Click "Continue" to proceed to the next step.</p>
    <button onclick="submitSelfAssertedForm()">Continue</button>
  </div>

  <script>
    function submitSelfAssertedForm() {
      if (typeof parent.submitSelfAssertedForm === 'function') {
        parent.submitSelfAssertedForm();
      } else {
        alert('Unable to proceed — form submission handler not found.');
      }
    }
  </script>
</body>
</html>
