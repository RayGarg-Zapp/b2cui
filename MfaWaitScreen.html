<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MFA Setup in Progress</title>
  <style>
    body {
      background-color: #f4faff;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      max-width: 500px;
      text-align: center;
    }
    h1 {
      color: #0078D4;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #0078D4;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005a9e;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Setting up Multi-Factor Authentication</h1>
    <p>This will only take a moment. Click below to continue once setup is complete.</p>
    <button onclick="submitSelfAssertedForm()">Continue</button>
  </div>

  <script>
    function submitSelfAssertedForm() {
      if (typeof parent.submitSelfAssertedForm === "function") {
        parent.submitSelfAssertedForm();
      } else {
        alert("Form submission function not available.");
      }
    }
  </script>
</body>
</html>
