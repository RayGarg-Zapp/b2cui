<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password • ZappSec</title>
  <style>
    :root{
      --bg:#0a1020; --bg2:#0f172a; --panel:#0c1424;
      --text:#e5e7eb; --muted:#9aa4b2; --accent:#4f7bf7;
      --ring:rgba(79,123,247,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
      background:radial-gradient(1200px 800px at 20% -10%, var(--bg2) 0%, var(--bg) 60%, #070b16 100%);
    }
    .container{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{
      width:100%;max-width:560px;padding:32px;border-radius:20px;
      background:linear-gradient(180deg, rgba(17,24,39,.9) 0%, rgba(9,13,23,.9) 100%);
      border:1px solid rgba(148,163,184,.12);
      box-shadow:0 10px 30px rgba(2,8,23,.4), inset 0 1px 0 rgba(255,255,255,.03);
    }
    .brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
    h1{margin:0 0 6px;font-size:clamp(22px,3.2vw,28px);font-weight:700;color:#eef2ff}
    .subtitle{margin:0 0 22px;color:var(--muted);font-size:14px}

    /* B2C form area */
    #api{margin-top:8px}
    #api label{display:block;margin:14px 0 8px;font-size:13px;color:var(--muted)}
    #api input[type="password"],
    #api input[type="text"],
    #api input[type="email"]{
      width:100%;appearance:none;background:#0b1326;color:var(--text);
      border:1px solid rgba(148,163,184,.16);border-radius:12px;
      padding:12px 14px;font-size:15px;outline:none;
      transition:border-color .2s, box-shadow .2s, background .2s;
    }
    #api input[type="password"]:focus,
    #api input[type="text"]:focus{
      border-color:var(--accent);box-shadow:0 0 0 6px var(--ring);
    }
    #api .buttons,#api .actionButtons{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
    #api input[type="submit"], #api button[type="submit"]{
      cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:600;
      background:linear-gradient(180deg, var(--accent) 0%, #3b6cf3 100%);color:#fff;
      box-shadow:0 8px 22px rgba(79,123,247,.35);
    }
    #api input[type="button"], #api button[type="button"], #api a#cancel{
      cursor:pointer;border:1px solid rgba(148,163,184,.22);
      background:transparent;color:var(--text);border-radius:12px;padding:12px 16px;text-decoration:none
    }
    #api ul,#api li{list-style:none;margin:0;padding:0}

    /* Error handling — only show when there is content or not hidden */
    #api .error:empty,
    #api .error.itemLevel:empty,
    #api .field-error:empty,
    #api .errorText:empty,
    #api .error[aria-hidden="true"],
    #api .error.itemLevel[aria-hidden="true"]{display:none !important}

    #api .error:not(:empty),
    #api .error.itemLevel:not(:empty),
    #api .field-error:not(:empty),
    #api .errorText:not(:empty){
      color:#fecaca;background:rgba(239,68,68,.08);
      border:1px solid rgba(239,68,68,.22);
      padding:10px 12px;border-radius:12px;margin-top:14px
    }

    #api a{color:var(--muted)} #api a:hover{opacity:.9}
    footer.note{margin-top:18px;font-size:12px;color:var(--muted)}
    @media (max-width:420px){.card{padding:22px;border-radius:16px}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">ZappSec • Azure AD B2C</div>
      <h1>Reset your password</h1>
      <p class="subtitle">Create a new password to continue.</p>
      <div id="api"></div>
      <footer class="note">Having trouble? You can close this window to cancel.</footer>
    </div>
  </div>
</body>
</html>
